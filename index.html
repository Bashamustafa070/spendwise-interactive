<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Interactive Budgeting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SpendWise Dashboard</h1>
            <p>Track your expenses and monitor your budget effortlessly.</p>
        </header>

        <!-- Budget Input / Setup -->
        <section class="budget-setup">
            <label for="monthly-budget">Set Monthly Budget ($):</label>
            <input type="number" id="monthly-budget" placeholder="e.g., 1000">
            <button id="set-budget-btn">Update Budget</button>
        </section>

        <!-- Summary Cards -->
        <section class="dashboard-summary">
            <div class="card">
                <h3>Total Budget</h3>
                <p id="display-budget">$0.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="display-total-expenses">$0.00</p>
            </div>
            <div class="card">
                <h3>Remaining Balance</h3>
                <p id="display-balance">$0.00</p>
            </div>
        </section>

        <!-- Budget Feedback Alert -->
        <div id="budget-alert" class="alert hidden"></div>

        <!-- Add Expense Form -->
        <section class="expense-form-section">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-name">Expense Name:</label>
                    <input type="text" id="expense-name" placeholder="e.g., Groceries" required>
                </div>
                <div class="form-group">
                    <label for="expense-amount">Amount ($):</label>
                    <input type="number" id="expense-amount" placeholder="e.g., 50" step="0.01" required>
                </div>
                <button type="submit" id="add-expense-btn">Add Expense</button>
            </form>
        </section>

        <!-- Expense List Section -->
        <section class="expense-list-section">
            <h2>Expense Records</h2>
            <ul id="expense-list">
                <!-- Expenses will be dynamically inserted here -->
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
